name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli@latest

      - name: Configure Bubblewrap Non-Interactively
        run: |
          # Dynamically locate the pre-installed cmdline-tools under ANDROID_HOME
          REAL_TOOLS_BIN=$(find $ANDROID_HOME/cmdline-tools -name "sdkmanager" -print -quit)
          REAL_TOOLS_DIR=$(dirname $(dirname "$REAL_TOOLS_BIN"))
          echo "Using verified cmdline-tools directory: $REAL_TOOLS_DIR"
          
          # Create a custom SDK layout that Bubblewrap expects, linking to the pre-installed SDK
          mkdir -p /home/runner/android-sdk
          ln -s "$REAL_TOOLS_DIR" /home/runner/android-sdk/tools
          ln -s $ANDROID_HOME/build-tools /home/runner/android-sdk/build-tools
          ln -s $ANDROID_HOME/platforms /home/runner/android-sdk/platforms
          ln -s $ANDROID_HOME/platform-tools /home/runner/android-sdk/platform-tools
          ln -s $ANDROID_HOME/licenses /home/runner/android-sdk/licenses
          
          # Verify the components are successfully mapped
          echo "=== Verifying Custom Android SDK Structure ==="
          ls -la /home/runner/android-sdk
          ls -la /home/runner/android-sdk/tools/bin/sdkmanager
          
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"/home/runner/android-sdk\"}" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json

      - name: Create Android Keystore
        run: |
          keytool -genkey -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass "vaicar123" -keypass "vaicar123" -dname "CN=vaicar, OU=IT, O=VaiCar, L=SaoSebastiao, S=SP, C=BR"

      - name: Generate Android Project and Build APK
        env:
          ANDROID_HOME: /home/runner/android-sdk
          ANDROID_SDK_ROOT: /home/runner/android-sdk
          BUBBLEWRAP_KEYSTORE_PASSWORD: "vaicar123"
          BUBBLEWRAP_KEY_PASSWORD: "vaicar123"
        run: |
          # Start a local static server to serve manifest.json locally so download never fails with 404
          python3 -m http.server 8080 --directory public &
          sleep 2
          
          # Temporarily change webManifestUrl in twa-manifest.json to point to the local server
          sed -i 's|"webManifestUrl": "https://[^"]*"|"webManifestUrl": "http://localhost:8080/manifest.json"|g' twa-manifest.json
          cat twa-manifest.json
          
          # Use both CLI flags and yes pipe to guarantee zero interactive prompts
          yes "" | bubblewrap update --manifest=twa-manifest.json --skipVersionUpgrade --skipConfig
          yes "" | bubblewrap build

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: vaicar-apk
          path: |
            **/build/outputs/apk/release/*.apk
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
