name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli@latest

      - name: Configure Bubblewrap Non-Interactively
        run: |
          # Dynamically locate the pre-installed cmdline-tools under ANDROID_HOME
          REAL_TOOLS_BIN=$(find $ANDROID_HOME/cmdline-tools -name "sdkmanager" -print -quit)
          REAL_TOOLS_DIR=$(dirname $(dirname "$REAL_TOOLS_BIN"))
          echo "Using verified cmdline-tools directory: $REAL_TOOLS_DIR"
          
          # Create a custom SDK layout that Bubblewrap expects, linking to the pre-installed SDK
          mkdir -p /home/runner/android-sdk
          ln -s "$REAL_TOOLS_DIR" /home/runner/android-sdk/tools
          ln -s $ANDROID_HOME/build-tools /home/runner/android-sdk/build-tools
          ln -s $ANDROID_HOME/platforms /home/runner/android-sdk/platforms
          ln -s $ANDROID_HOME/platform-tools /home/runner/android-sdk/platform-tools
          ln -s $ANDROID_HOME/licenses /home/runner/android-sdk/licenses
          
          # Verify the components are successfully mapped
          echo "=== Verifying Custom Android SDK Structure ==="
          ls -la /home/runner/android-sdk
          ls -la /home/runner/android-sdk/tools/bin/sdkmanager
          
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"/home/runner/android-sdk\"}" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json

      - name: Deploy Permanent Android Keystore
        run: |
          # Write the permanent keystore matching public/.well-known/assetlinks.json
          echo "" | base64 -d > android.keystore

      - name: Generate Android Project and Build APK
        env:
          ANDROID_HOME: /home/runner/android-sdk
          ANDROID_SDK_ROOT: /home/runner/android-sdk
          BUBBLEWRAP_KEYSTORE_PASSWORD: "vaicar123"
          BUBBLEWRAP_KEY_PASSWORD: "vaicar123"
        run: |
          # Start a local static server to serve manifest.json locally so download never fails during generation
          python3 -m http.server 8080 --directory public &
          sleep 2
          
          # Temporarily set webManifestUrl to local server for initial reading
          sed -i 's|"webManifestUrl": "https://[^"]*"|"webManifestUrl": "http://localhost:8080/manifest.json"|g' twa-manifest.json
          
          # Generate/update project with explicit non-empty appVersionName
          yes "1.0.0" | bubblewrap update --manifest=twa-manifest.json --appVersionName="1.0.0" --skipConfig
          
          # Restore live app URL in twa-manifest.json and strings.xml
          echo "=== Setting Live App URL ==="
          sed -i 's|"webManifestUrl": "http://localhost:8080/manifest.json"|"webManifestUrl": "https://ais-dev-57s7ktjqjz2sxaxitjmcqy-760146523751.europe-west2.run.app/manifest.json"|g' twa-manifest.json
          find . -type f \( -name "*.xml" -o -name "*.json" \) -exec sed -i 's|http://localhost:8080/|https://ais-dev-57s7ktjqjz2sxaxitjmcqy-760146523751.europe-west2.run.app/|g' {} +
          find . -type f \( -name "*.xml" -o -name "*.json" \) -exec sed -i 's|http://localhost:8080|https://ais-dev-57s7ktjqjz2sxaxitjmcqy-760146523751.europe-west2.run.app|g' {} +
          
          # Print strings.xml to verify production host and URLs
          echo "=== Generated strings.xml ==="
          find app -name "strings.xml" -exec cat {} + || true
          
          # Compile Android APK using Gradle directly (completely non-interactive)
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease
          else
            yes "1.0.0" | bubblewrap build --skipSigning
          fi

      - name: Robust Manual Align and Sign APK
        run: |
          # Find the built unsigned APK under gradle's output
          UNSIGNED_APK=$(find . -name "*unsigned.apk" -print -quit)
          echo "Found unsigned APK at: $UNSIGNED_APK"
          if [ -z "$UNSIGNED_APK" ]; then
            echo "Error: Unsigned APK not found!" && exit 1
          fi
          
          # Find build tools (zipalign and apksigner)
          ZIPALIGN_BIN=$(find /usr/local/lib/android/sdk/build-tools -name "zipalign" -print -quit)
          APKSIGNER_BIN=$(find /usr/local/lib/android/sdk/build-tools -name "apksigner" -print -quit)
          echo "Using zipalign: $ZIPALIGN_BIN"
          echo "Using apksigner: $APKSIGNER_BIN"
          
          # Align the APK
          $ZIPALIGN_BIN -v 4 "$UNSIGNED_APK" app-release-aligned.apk
          
          # Sign the APK manually using standard Android keystore toolchain
          $APKSIGNER_BIN sign --ks android.keystore --ks-pass pass:vaicar123 --key-pass pass:vaicar123 --ks-key-alias android --out vaicar-release-signed.apk app-release-aligned.apk
          
          # Verify signature is 100% correct
          $APKSIGNER_BIN verify vaicar-release-signed.apk
          echo "APK successfully verified and signed!"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: vaicar-apk
          path: ./vaicar-release-signed.apk
          if-no-files-found: error
