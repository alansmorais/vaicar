name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli@latest

      - name: Configure Bubblewrap Non-Interactively
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"/usr/local/lib/android/sdk\"}" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json

      - name: Create Android Keystore
        run: |
          keytool -genkey -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass "vaicar123" -keypass "vaicar123" -dname "CN=vaicar, OU=IT, O=VaiCar, L=SaoSebastiao, S=SP, C=BR"

      - name: Generate Android Project and Build APK
        run: |
          # Non-interactive project creation/update and compilation by feeding newlines (Enters) to prompt answers
          printf "\n\n\n\n\n" | bubblewrap update --manifest=twa-manifest.json
          bubblewrap build --signingKey.password="vaicar123" --signingKey.aliasPassword="vaicar123"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: vaicar-apk
          path: |
            **/build/outputs/apk/release/*.apk
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
